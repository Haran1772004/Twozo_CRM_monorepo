  kafka-connect:
    url: ${TLC-CONFIG-KAKFA-CONNECT-URL}
    connector:
      source:
        config:
          connector.class: io.debezium.connector.postgresql.PostgresConnector
          database.hostname: ${TLC-CONFIG-DATABASE-SERVER-WITHOUT-PORT}
          database.port: ${TLC-CONFIG-DATABASE-PORT}
          database.user: ${TLC-CONFIG-DATABASE-USERNAME}
          database.password: ${TLC-CONFIG-DATABASE-PASSWORD}
          database.dbname: ${TLC-CONFIG-DATABASE-NAME}
          plugin.name: pgoutput
          topic.prefix: crm
          publication.autocreate.mode: filtered
          schema.include.list: public
          snapshot.mode: initial
          heartbeat.interval.ms: 20000
          producer.override.batch.size: 524288
          producer.override.linger.ms: 10
          key.converter: org.apache.kafka.connect.json.JsonConverter
          value.converter: org.apache.kafka.connect.json.JsonConverter
          key.converter.schemas.enable: "false"
          value.converter.schemas.enable: "false"
          schema.history.internal.kafka.bootstrap.servers: ${TLC-CONFIG-KAFKA-SERVER}
      analytics.sink:
        topic.partition: 2
        config:
          tasks.max: 1
          connector.class: com.clickhouse.kafka.connect.ClickHouseSinkConnector
          clickhouse.table.name.format: ${topic}
          hostname: ${TLC-CONFIG-CLICKHOUSE-SERVER}
          port: ${TLC-CONFIG-CLICKHOUSE-PORT}
          database: ${TLC-CONFIG-CLICKHOUSE-DATABASE}
          username: ${TLC-CONFIG-CLICKHOUSE-USERNAME}
          password: ${TLC-CONFIG-CLICKHOUSE-PASSWORD}
          auto.create.tables: false
          batch.size: 20000
          linger.ms: 5000
          consumer.override.max.poll.records: 15000
          consumer.override.max.partition.fetch.bytes: 30485760
          consumer.override.fetch.max.bytes: 60485760
          key.converter: org.apache.kafka.connect.storage.StringConverter
          value.converter: org.apache.kafka.connect.json.JsonConverter
          value.converter.schemas.enable: false
          errors.tolerance: all
          errors.log.enable: true
          errors.log.include.messages: true
          errors.deadletterqueue.topic.replication.factor: 1
          errors.deadletterqueue.context.headers.enable: true

  font:
    basePath: ${TLC-CONFIG-FONT-BASEPATH}
    config:
      lexend:
        name: Lexend
        fonts:
          - name: lexendRegular
            fileName: lexend-regular.ttf
            style: NORMAL
            weight: 400
            subset: true

          - name: lexendMedium
