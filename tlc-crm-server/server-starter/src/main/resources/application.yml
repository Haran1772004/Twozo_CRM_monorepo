            style: NORMAL
            weight: 500
            subset: true

          - name: lexendSemiBold
            fileName: lexend-semi-bold.ttf
            style: NORMAL
            weight: 400
            subset: true

          - name: lexendThin
            fileName: lexend-thin.ttf
            style: NORMAL
            weight: 100
            subset: true

