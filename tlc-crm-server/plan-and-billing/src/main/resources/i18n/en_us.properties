#plan descriptions
i18n.plan.description.essential=Get organized and set up simple sales processes quickly.
i18n.plan.description.professional=Optimize performance with more customizations and reporting.
i18n.plan.description.enterprise=Experience Twozo without limits and have ultimate peace of mind.
i18n.plan.description.buildIn.phone=Buy phone numbers and make & receive calls using the phone widget in your Team Inbox. Additional credits can be bought as needed. Any credits purchased during your trial period will be carried over when you upgrade to a paid plan. Phone credits are not auto-renewed with your next renewal.
i18n.plan.description.workflows=Automation rules to handle repetitive work, such as welcome emails and adding tasks. dd workflows in multiples of 10. This add-on is automatically included in your next subscription renewal.
i18n.plan.description.reports=Generate performance reports and dashboards to monitor key metrics, team activities, and business outcomes. Add reports in multiples of 10. Renewed automatically with your next subscription cycle.

i18n.plan.simplified.description.buildIn.phone=Buy phone numbers and use credits to make calls within the billing period.
i18n.plan.simplified.description.workflows=Automate up to 10 workflows to simplify daily tasks and actions.
i18n.plan.simplified.description.reports=Build 10 reports with dashboards to track and view key insights.

#plan key features
i18n.plan.key.features.essential.1=Lead, deal, contact, calendar and pipeline management.
i18n.plan.key.features.essential.2=Seamless data import and 400+ integrations.
i18n.plan.key.features.essential.3=24/7, multi-language support.

i18n.plan.key.features.professional.1=Multiple email sync and extra customization options.
i18n.plan.key.features.professional.2=Streamlined lead routing and account access controls for teams.
i18n.plan.key.features.professional.3=Revenue forecasts and deeper reporting capabilities.

i18n.plan.key.features.enterprise.1=Enhanced security preferences.
i18n.plan.key.features.enterprise.2=Complete access to all features.
i18n.plan.key.features.enterprise.3=Unlimited reports and customizations.

