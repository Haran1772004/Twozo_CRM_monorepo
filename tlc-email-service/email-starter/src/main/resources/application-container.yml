  email:
    domain:
      name: 'twozo.net'
      node: mail
    addOnServices:
      includeEnvDomainInSharedAddress: true
      domain: '@twozo.net'
      smartBcc:
        alias:
          prefix: smartbcc+
      teamInbox:
        alias:
          prefix: teaminbox+
        verification:
          verifiedFromAddresses:
            gmail: forwarding-noreply@google.com
            outlook: no-reply@outlook.com, no-reply@microsoft.com, outlook-noreply@microsoft.com

    executor:
      auto-sync:
        retrieve:
          thread:
            name: email-auto-sync-handler
            pool.size: 10
            daemon: false
          consumer:
            name: tlc-email-server-auto-sync-consumer
            max.records: 10
            poll.duration: 1000
            max.queue.size: 10

      request-state:
        thread:
          name: email-request-state-handler
          pool.size: 1
          daemon: false
        consumer:
          name: tlc-email-server-email-state-request-handler-consumer
          max.records: 10
          pool.duration: 1000
          max.queue.size: 10
      sync:
        retrieve:
          thread:
            name: email-retrieve-sync-handler
            pool.size: 1
            daemon: false
          consumer:
            name: tlc-email-serversync-retrieve-consumer
            max.records: 10
            poll.duration: 1000
            max.queue.size: 10

      inbound:
        retrieve:
          thread:
            name: inbound-email-retrieve-handler
            pool.size: 1
            daemon: false
          consumer:
            name: tlc-email-server-inbound-email-retrieve-consumer
            max.records: 10
            poll.duration: 1000
            max.queue.size: 10
        retry:
          schedule:
            delay: 3600000
          object:
            prefix:

      webhook:
        receiver:
          thread:
            name: email-webhook-sync-handler
            pool.size: 1
            daemon: false
          consumer:
            name: tlc-email-server-webhook-sync-consumer
            max.records: 10
            poll.duration: 1000
            max.queue.size: 10

        renewal:
          schedule:
            delay: 120000 #in milliseconds

  queue:
    consumerBufferBytes: 5000000
    heartbeatInterval: 10000
    sessionTimeout: 30000
    maxPollInterval: 300000
    provider: SelfManagedKafka
    async:
      offset:
        writer:
          pool: async-offset-writer-pool:3
    kafka:
      selfManaged:
        server: PLAINTEXT://kafka:9092
      managed:
        server: ${MANAGED_KAFKA_SERVER_ENDPOINT}
        security.protocol: SASL_SSL
        sasl.mechanism: AWS_MSK_IAM
        sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
        sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler

    topics:
      - EMAIL_SEND_REQUESTED:1
      - SYNC_STATUS_UPDATE_REQUEST:1
      - EMAIL_SYNC_RETRIEVED:2
      - AUTO_SYNC_RETRIEVED:3
      - SMART_BCC_RETRIEVED:1
      - SYNC_DATA_LOADER:1
      - AUTO_SYNC_DATA_LOADER:1
      - SMART_BCC_DATA_LOADER:1
      - TRANSACTIONAL_MAIL_SEND_REQUESTED:1
      - SEND_REQUEST_TO_PROVIDER:1
      - DELETE_REQUEST_TO_PROVIDER:1
      - UPDATE_REQUEST_TO_PROVIDER:1
      - EMAIL_STATE_MODIFIED:1
      - WEBHOOK_NOTIFICATION_RECEIVED:3
      - INBOUND-EMAIL-RECEIVED:1
      - AUTO_SYNC_DATA_LOADER:1
      - DOMAIN_REQUEST_TO_PROVIDER:1
      - DOMAIN_ACTION_REQUESTED:1

