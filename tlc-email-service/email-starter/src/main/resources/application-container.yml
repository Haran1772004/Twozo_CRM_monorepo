      cluster:
        manager: zookeeper
        hazelcast:
          host: hazelcast
          port: 5701
        zookeeper:
          host: zookeeper:2181
          rootPath: io.vertx
          initialSleepTime: 1000
          maxTimes: 5

  services:
    enabled:
