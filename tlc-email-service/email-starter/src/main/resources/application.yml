spring:
  cloud:
    azure:
      keyvault:
        secret:
          credential:
            managed-identity-enabled: true
          property-source-enabled: ${SPRING_CLOUD_AZURE_KEYVAULT_SECRET_PROPERTY_SOURCE_ENABLED:true}
          property-sources:
            - name: email-config
              endpoint: ${SPRING_CLOUD_AZURE_KEYVAULT_SECRET_PROPERTY_SOURCES_ENDPOINT}
              secret-keys:
                - TLC-CONFIG-DATABASE-PASSWORD
                - TLC-CONFIG-DATABASE-NAME
                - TLC-CONFIG-DATABASE-USERNAME
                - TLC-CONFIG-DATABASE-SERVER
                - TLC-CONFIG-STORAGE-AWS-ACCESSKEY
                - TLC-CONFIG-STORAGE-AWS-SERVER
                - TLC-CONFIG-STORAGE-AWS-SECRETKEY
                - TLC-CONFIG-STORAGE-AWS-BUCKET
                - TLC-CONFIG-STORAGE-AWS-INBOUND-BUCKET
                - TLC-CONFIG-STORAGE-AWS-REGION
                - TLC-CONFIG-STORAGE-AZURE-ACCOUNTNAME
                - TLC-CONFIG-STORAGE-AZURE-ACCOUNTKEY
                - TLC-CONFIG-STORAGE-AZURE-ENDPOINT
                - TLC-CONFIG-STORAGE-AZURE-CONTAINERS-INDEX-0
                - TLC-CONFIG-STORAGE-AZURE-CONTAINERS-INDEX-1
                - TLC-CONFIG-STORAGE-AZURE-AZURITE-ENDPOINT
                - TLC-CONFIG-STORAGE-AZURE-AUTHTYPE
                - TLC-CONFIG-QUEUE-PROVIDER
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-SERVER
                - TLC-CONFIG-QUEUE-KAFKA-SELFMANAGED-SERVER
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-OAUTHBEARER-TOKEN-ENDPOINT-URL
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-AUTH-CALLBACK-SCOPE
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-AWS-SASL-MECHANISM
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-AWS-SASL-JAAS-CONFIG
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-AWS-SASL-CLIENT-CALLBACK-HANDLER-CLASS
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-JAAS-CONFIG
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-LOGIN-CALLBACK-HANDLER-CLASS
                - TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-MECHANISM
                - TLC-CONFIG-EMAIL-APP-LOCAL-NAVIGATEURL-ERROR
                - TLC-CONFIG-EMAIL-APP-LOCAL-NAVIGATEURL-SYNC
                - TLC-CONFIG-EMAIL-APP-GMAIL-PUBSUBTOPIC
                - TLC-CONFIG-EMAIL-APP-GMAIL-CLIENT-SECRET
                - TLC-CONFIG-EMAIL-APP-GMAIL-CLIENT-ID
                - TLC-CONFIG-EMAIL-APP-OUTLOOK-ALIAS-ID
                - TLC-CONFIG-EMAIL-APP-OUTLOOK-CLIENT-ID
                - TLC-CONFIG-EMAIL-APP-OUTLOOK-ALIAS-CLIENT-SECRET
                - TLC-CONFIG-EMAIL-APP-OUTLOOK-CLIENT-SECRET
                - TLC-CONFIG-EMAIL-APP-OUTLOOK-TENANTAUTHORITY
                - TLC-CONFIG-EMAIL-APP-OUTLOOK-ALIAS-CLIENT-ID
                - TLC-CONFIG-EMAIL-ADDONSERVICES-DOMAIN
                - TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-SERVER-REDIRECTURL-SUCCESS
                - TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-SERVER-REDIRECTURL-FAILURE
                - TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-SERVER-REDIRECTURL-VALIDATELINK
                - TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-VERIFICATION-VERIFIEDFROMADDRESSES-GMAIL
                - TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-VERIFICATION-VERIFIEDFROMADDRESSES-OUTLOOK
                - TLC-CONFIG-OUTLOOK-WEBHOOK-NOTIFICATION-URL
                - TLC-CONFIG-OUTLOOK-WEBHOOK-CERTIFICATE-PUBLIC-KEY
                - TLC-CONFIG-WEB-ALLOWEDORIGINS
                - TLC-CONFIG-WEB-DEFAULT-DOMAIN
                - TLC-CONFIG-WEB-CLIENT-VERTX-CLUSTER-HAZELCAST-HOST
                - TLC-CONFIG-NOTIFICATION-MAILSERVICE-SES-SECRETKEY
                - TLC-CONFIG-NOTIFICATION-EMAIL-OUTLOOK-TENANT-ID
                - TLC-CONFIG-NOTIFICATION-MAILSERVICE-ACS-CONNECTIONSTRING
                - TLC-CONFIG-NOTIFICATION-MAILSERVICE-SENDGRID-APIKEY
                - TLC-CONFIG-NOTIFICATION-EMAIL-SENDER-ADDRESS
                - TLC-CONFIG-NOTIFICATION-MAILSERVICE-FROM
                - TLC-CONFIG-NOTIFICATION-EMAIL-SENDER-ID
                - TLC-CONFIG-NOTIFICATION-MAILSERVICE-SES-ACCESSKEY
                - TLC-CONFIG-NOTIFICATION-MAILSERVICE-SES-REGION
                - TLC-CONFIG-ZOOKEEPER-SERVER
                - TLC-CONFIG-CACHE-SERVER
                - TLC-CONFIG-CACHE-PASSWORD
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-AUTHORITY
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-SCOPE-EMAIL
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-SCOPE-CALENDAR
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-SCOPE-CONTACT
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-ACCESSTOKENURL
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-TOKENINFOURL
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-REDIRECTURL-EMAIL
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-REDIRECTURL-CALENDAR
                - TLC-CONFIG-SYNC-SERVICE-GMAIL-REDIRECTURL-CONTACT
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-AUTHORITY
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-ACCESSTOKENURL
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-DEFAULTSCOPE
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-TOKENROTATIONSCOPE
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-COMMONAUTHORITY
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-SCOPE-EMAIL
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-SCOPE-CALENDAR
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-SCOPE-CONTACT
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-WEBHOOK-RESOURCE
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-REDIRECTURL-EMAIL
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-REDIRECTURL-CALENDAR
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-REDIRECTURL-CONTACT
                - TLC-CONFIG-SYNC-SERVICE-OUTLOOK-WEBHOOK-CHANGETYPE
                - TLC-CONFIG-SYNC-SERVICE-SERVER-REDIRECTURL-SYNC
                - TLC-CONFIG-SYNC-SERVICE-SERVER-REDIRECTURL-TRACKING
                - TLC-CONFIG-SYNC-SERVICE-SERVER-REDIRECTURL-ERROR

  application.name: twozo-email
  profiles.active: ${SPRING_PROFILES_ACTIVE}

logging:
  level:
    root: INFO
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%thread] %logger{35} - %msg%n"
  file:
    name: logs/twozo-email-service.log

tlc.config:
  storage:
    client: ${TLC_CONFIG_STORAGE_CLIENT}
    azure:
      accountName: ${TLC-CONFIG-STORAGE-AZURE-ACCOUNTNAME}
      accountKey: ${TLC-CONFIG-STORAGE-AZURE-ACCOUNTKEY}
      endpoint: ${TLC-CONFIG-STORAGE-AZURE-ENDPOINT}
      authType: ${TLC-CONFIG-STORAGE-AZURE-AUTHTYPE}
      containers:
        - ${TLC-CONFIG-STORAGE-AZURE-CONTAINERS-INDEX-0}
        - ${TLC-CONFIG-STORAGE-AZURE-CONTAINERS-INDEX-1}
      azurite:
        enabled: ${TLC_CONFIG_STORAGE_AZURE_AZURITE_ENABLED}
        endpoint: ${TLC-CONFIG-STORAGE-AZURE-AZURITE-ENDPOINT}
    aws:
      server: ${TLC-CONFIG-STORAGE-AWS-SERVER}
      accessKey: ${TLC-CONFIG-STORAGE-AWS-ACCESSKEY}
      secretKey: ${TLC-CONFIG-STORAGE-AWS-SECRETKEY}
      bucket: ${TLC-CONFIG-STORAGE-AWS-BUCKET}
      region: ${TLC-CONFIG-STORAGE-AWS-REGION}
      authMethod: ${TLC_CONFIG_STORAGE_AWS_AUTHMETHOD}
      httpClient:
        maxConnection: 120
        connectionTimeout: 10
        acquisitionTimeout: 30
    inbound:
      server: ${TLC-CONFIG-STORAGE-AWS-SERVER}
      accessKey: ${TLC-CONFIG-STORAGE-AWS-ACCESSKEY}
      secretKey: ${TLC-CONFIG-STORAGE-AWS-SECRETKEY}
      bucket: ${TLC-CONFIG-STORAGE-AWS-INBOUND-BUCKET}
      region: ${TLC-CONFIG-STORAGE-AWS-REGION}
      httpClient:
        maxConnection: 120
        connectionTimeout: 10
        acquisitionTimeout: 30

  cache:
    type: ${TLC_CONFIG_CACHE_TYPE}
    scheme: ${TLC_CONFIG_CACHE_SCHEME}
    server: ${TLC-CONFIG-CACHE-SERVER}
    password: ${TLC-CONFIG-CACHE-PASSWORD}
    test-enabled: ${TLC_CONFIG_CACHE_TEST_ENABLED}

  zookeeper:
    server: ${TLC-CONFIG-ZOOKEEPER-SERVER}
    maxRetry: 3
    retryWait: 1000
    connectionTimeout: 5000
    sessionTimeout: 500000

  database:
    oltp:
      name: ${TLC-CONFIG-DATABASE-NAME}
      server: ${TLC-CONFIG-DATABASE-SERVER}
      username: ${TLC-CONFIG-DATABASE-USERNAME}
      password: ${TLC-CONFIG-DATABASE-PASSWORD}
      developmentModeEnabled: ${TLC_CONFIG_DATABASE_DEVELOPMENTMODEENABLED}
      connectionPool:
        max: 12
        idle: 4
        idle.timeout: 300000
        maxLifetime: 1800000
        connectionTimeout: 30000
        leakDetectionThreshold: 60000
        name: email-oltp-pool

  database-resource:
    serverMode: ${TLC_CONFIG_DATABASE_RESOURCE_SERVERMODE}
    snapshotPath: sql/snapshot
    home: ${TLC_CONFIG_DATABASE_RESOURCE_HOME:twozo}
    storeType: ${TLC_CONFIG_DATABASE_RESOURCE_STORETYPE:remote}

  notification:
    email:
      sender:
        address: ${TLC-CONFIG-NOTIFICATION-EMAIL-SENDER-ADDRESS}
        id: ${TLC-CONFIG-NOTIFICATION-EMAIL-SENDER-ID}
      outlook:
        tenant.id: ${TLC-CONFIG-NOTIFICATION-EMAIL-OUTLOOK-TENANT-ID}
      smtp.gmail:
        port: 465
        host: smtp.gmail.com
      imap.gmail:
        port: 993
        host: imap.gmail.com
    mailService:
      client: ${TLC_CONFIG_NOTIFICATION_MAILSERVICE_CLIENT}
      from: ${TLC-CONFIG-NOTIFICATION-MAILSERVICE-FROM}
      ses:
        accessKey: ${TLC-CONFIG-NOTIFICATION-MAILSERVICE-SES-ACCESSKEY}
        secretKey: ${TLC-CONFIG-NOTIFICATION-MAILSERVICE-SES-SECRETKEY}
        region: ${TLC-CONFIG-NOTIFICATION-MAILSERVICE-SES-REGION}
      sendGrid:
        apiKey: ${TLC-CONFIG-NOTIFICATION-MAILSERVICE-SENDGRID-APIKEY}
      acs:
        connectionString: ${TLC-CONFIG-NOTIFICATION-MAILSERVICE-ACS-CONNECTIONSTRING}

  sync-service:
    webhook:
      renewal:
        limit: 100

    gmail:
      name: ${TLC_CONFIG_EMAIL_APP_GMAIL_NAME}
      authority: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-AUTHORITY}
      responseType: code
      grantType: authorization_code
      app:
        prompt: select_account consent
      client:
        id: ${TLC-CONFIG-EMAIL-APP-GMAIL-CLIENT-ID}
        secret: ${TLC-CONFIG-EMAIL-APP-GMAIL-CLIENT-SECRET}
      scope:
        email: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-SCOPE-EMAIL}
        calendar: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-SCOPE-CALENDAR}
        contact: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-SCOPE-CONTACT}
      accessTokenUrl: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-ACCESSTOKENURL}
      tokenInfoUrl: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-TOKENINFOURL}
      pubSubTopic: ${TLC-CONFIG-EMAIL-APP-GMAIL-PUBSUBTOPIC}
      batch:
        size:
          message: 10
          history: 10
      alias.createAlias:
        prefix: emailvalidate2022+
        suffix: "@gmail.com"
      redirectUrl:
        email: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-REDIRECTURL-EMAIL}
        calendar: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-REDIRECTURL-CALENDAR}
        contact: ${TLC-CONFIG-SYNC-SERVICE-GMAIL-REDIRECTURL-CONTACT}

    outlook:
      client:
        id: ${TLC-CONFIG-EMAIL-APP-OUTLOOK-CLIENT-ID}
        secret: ${TLC-CONFIG-EMAIL-APP-OUTLOOK-CLIENT-SECRET}
      tenantAuthority: ${TLC-CONFIG-EMAIL-APP-OUTLOOK-TENANTAUTHORITY}
      authority: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-AUTHORITY}
      app:
        prompt: select_account
      responseType: code
      grantType: authorization_code
      accessTokenUrl: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-ACCESSTOKENURL}
      defaultScope: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-DEFAULTSCOPE}
      tokenRotationScope: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-TOKENROTATIONSCOPE}
      commonAuthority: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-COMMONAUTHORITY}
      scope:
        email: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-SCOPE-EMAIL}
        calendar: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-SCOPE-CALENDAR}
        contact: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-SCOPE-CONTACT}
      refreshTokenExpiryDays: 89
      webhook:
        changeType: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-WEBHOOK-CHANGETYPE}
        resource: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-WEBHOOK-RESOURCE}
        latestSupportedTlsVersion: 'v1_2'
        certificate:
          id: 'v1'
          key:
            public: ${TLC-CONFIG-OUTLOOK-WEBHOOK-CERTIFICATE-PUBLIC-KEY}
            private: ${TLC_CONFIG_OUTLOOK_WEBHOOK_CERTIFICATE_PRIVATE_KEY}
        notificationUrl: ${TLC-CONFIG-OUTLOOK-WEBHOOK-NOTIFICATION-URL}
      batch:
        size:
          message: 10
      alias:
        client:
          id: ${TLC-CONFIG-EMAIL-APP-OUTLOOK-ALIAS-CLIENT-ID}
          secret: ${TLC-CONFIG-EMAIL-APP-OUTLOOK-ALIAS-CLIENT-SECRET}
        id: ${TLC-CONFIG-EMAIL-APP-OUTLOOK-ALIAS-ID}

      redirectUrl:
        email: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-REDIRECTURL-EMAIL}
        calendar: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-REDIRECTURL-CALENDAR}
        contact: ${TLC-CONFIG-SYNC-SERVICE-OUTLOOK-REDIRECTURL-CONTACT}
    local.navigateUrl:
      sync: ${TLC-CONFIG-EMAIL-APP-LOCAL-NAVIGATEURL-SYNC}
      error: ${TLC-CONFIG-EMAIL-APP-LOCAL-NAVIGATEURL-ERROR}

    server:
      redirectUrl:
        unsubscribe:
        sync: ${TLC-CONFIG-SYNC-SERVICE-SERVER-REDIRECTURL-SYNC}
        tracking: ${TLC-CONFIG-SYNC-SERVICE-SERVER-REDIRECTURL-TRACKING}
        error: ${TLC-CONFIG-SYNC-SERVICE-SERVER-REDIRECTURL-ERROR}

  queue:
    consumerBufferBytes: 5000000
    heartbeatInterval: 10000
    sessionTimeout: 30000
    maxPollInterval: 300000
    provider: ${TLC-CONFIG-QUEUE-PROVIDER}
    async:
      offset:
        writer:
          pool: async-offset-writer-pool:3
    kafka:
      selfManaged:
        server: ${TLC-CONFIG-QUEUE-KAFKA-SELFMANAGED-SERVER}
      managed:
        server: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-SERVER}
        security.protocol: ${TLC_CONFIG_QUEUE_KAFKA_MANAGED_SECURITY_PROTOCOL}
        provider: ${TLC_CONFIG_QUEUE_KAFKA_MANAGED_PROVIDER}
        aws:
          sasl:
            mechanism: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-AWS-SASL-MECHANISM}
            jaas.config: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-AWS-SASL-JAAS-CONFIG}
            client.callback.handler.class: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-AWS-SASL-CLIENT-CALLBACK-HANDLER-CLASS}
        azure:
          sasl:
            mechanism: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-MECHANISM}
            jaas.config: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-JAAS-CONFIG}
            login.callback.handler.class: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-LOGIN-CALLBACK-HANDLER-CLASS}
            oauthbearer.token.endpoint.url: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-OAUTHBEARER-TOKEN-ENDPOINT-URL}
            auth.callback:
              scope: ${TLC-CONFIG-QUEUE-KAFKA-MANAGED-AZURE-SASL-AUTH-CALLBACK-SCOPE}
              principal: azure-cli
    topics:
      - EMAIL_SEND_REQUESTED:1
      - SYNC_STATUS_UPDATE_REQUEST:1
      - EMAIL_SYNC_RETRIEVED:1
      - SMART_BCC_RETRIEVED:1
      - SYNC_DATA_LOADER:3
      - SMART_BCC_DATA_LOADER:1
      - TRANSACTIONAL_MAIL_SEND_REQUESTED:1
      - SEND_REQUEST_TO_PROVIDER:1
      - DELETE_REQUEST_TO_PROVIDER:1
      - UPDATE_REQUEST_TO_PROVIDER:1
      - AUTO_SYNC_DATA_LOADER:1
      - AUTO_SYNC_RETRIEVED:1
      - WEBHOOK_NOTIFICATION_RECEIVED:3
      - INBOUND-EMAIL-RECEIVED:1
      - DOMAIN_REQUEST_TO_PROVIDER:1
      - DOMAIN_ACTION_REQUESTED:1

  email:
    domain:
      name: 'twozo.net'
      node: mail
    addOnServices:
      domain: ${TLC-CONFIG-EMAIL-ADDONSERVICES-DOMAIN}
      env: ${TLC_CONFIG_EMAIL_ADDONSERVICES_ENV}
      includeEnvDomainInSharedAddress: ${TLC_CONFIG_EMAIL_ADDONSERVICES_INCLUDE_ENV_DOMAIN_IN_SHARED_ADDRESS}
      smartBcc:
        alias:
          prefix: smartbcc
      teamInbox:
        alias:
          prefix: teaminbox
        server.redirectUrl:
          success: ${TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-SERVER-REDIRECTURL-SUCCESS}
          failure: ${TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-SERVER-REDIRECTURL-FAILURE}
          validateLink: ${TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-SERVER-REDIRECTURL-VALIDATELINK}
        verification:
          verifiedFromAddresses:
            gmail: ${TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-VERIFICATION-VERIFIEDFROMADDRESSES-GMAIL}
            outlook: ${TLC-CONFIG-EMAIL-ADDONSERVICES-TEAMINBOX-VERIFICATION-VERIFIEDFROMADDRESSES-OUTLOOK}

    executor:
      request-state:
        thread:
          name: email-request-state-handler
          pool.size: 10
          daemon: false
        consumer:
          name: tlc-email-server-email-state-request-handler-consumer
          max.records: 10
          pool.duration: 1000
          max.queue.size: 10
      sync:
        retrieve:
          thread:
            name: email-retrieve-sync-handler
            pool.size: 10
            daemon: false
          consumer:
            name: tlc-email-serversync-retrieve-consumer
            max.records: 10
            poll.duration: 1000
            max.queue.size: 10

      inbound:
        retrieve:
          thread:
            name: inbound-email-retrieve-handler
            pool.size: 10
            daemon: false
          consumer:
            name: tlc-email-server-inbound-email-retrieve-consumer
            max.records: 10
            poll.duration: 1000
            max.queue.size: 10
        retry:
          schedule:
            delay: 3600000
          object:
            prefix:

      auto-sync:
        retrieve:
          thread:
            name: email-auto-sync-handler
            pool.size: 10
            daemon: false
          consumer:
            name: tlc-email-server-auto-sync-consumer
            max.records: 10
            poll.duration: 1000
            max.queue.size: 10

      webhook:
        receiver:
          thread:
            name: email-webhook-sync-handler
            pool.size: 10
            daemon: false
          consumer:
            name: tlc-email-server-webhook-sync-consumer
            max.records: 10
            poll.duration: 1000
            max.queue.size: 10

        renewal:
          schedule:
            delay: 120000 #in milliseconds

  scheduler:
    pool: zk-health-checker:1,vertx-cluster-reboot:1,session-cleaner-pool:1,scheduled-email-pool:1,user-sync-email-pool:1,email-trash-pool:1,email-sync-thread-pool:2,email-sync-pool:1,email-retrieve-thread-pool:1,auto-sync-retrieve-pool:1,sync-retrieve-pool:1,inbound-retrieve-pool:1,inbound-email-retry-pool:1,transactional-email-sender-pool:1,provider-send-request-pool:1,provider-delete-request-pool:1,provider-update-request-pool:1,webhook-receiver-pool:3,webhook-receiver-renewal-pool:1,token-refresh-pool:1,background-sync-pool:1,provider-domain-request-pool:1

  web:
    app.name: EMAIL
    http.port: ${TLC_CONFIG_WEB_HTTP_PORT}
    path.prefix: /api/email-service
    default.domain: ${TLC-CONFIG-WEB-DEFAULT-DOMAIN}
    allowedOrigins: ${TLC-CONFIG-WEB-ALLOWEDORIGINS}

  web-client:
    vertx:
      cluster:
        manager: ${TLC_CONFIG_WEB_CLIENT_VERTX_CLUSTER_MANAGER}
        hazelcast:
          host: ${TLC-CONFIG-WEB-CLIENT-VERTX-CLUSTER-HAZELCAST-HOST}
          port: ${TLC_CONFIG_WEB_CLIENT_VERTX_CLUSTER_HAZELCAST_PORT}
        zookeeper:
          host: ${TLC-CONFIG-ZOOKEEPER-SERVER}
          rootPath: io.vertx
          initialSleepTime: 1000
          maxTimes: 5

  services:
    enabled:
      - storage
      - cache
      - database
      - database-resource
      - notification
      - email-app
      - queue
      - scheduler
      - web
      - sync-service
      - token-refresh